[package]
name = "opencv-no-c-videoio"
description = "cv::videoio for opencv-no-c: AVI, Y4M and image-sequence capture and writing."
version.workspace = true
edition.workspace = true
rust-version = "1.77"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
# Published as `opencv-no-c-videoio` (`cv-core` on crates.io belongs to another
# project); the library keeps its short name, so code still says `cv_*`.
name = "cv_videoio"

[dependencies]
cv-core.workspace = true
cv-imgcodecs.workspace = true
cv-imgproc.workspace = true
