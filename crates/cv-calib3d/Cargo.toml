[package]
name = "opencv-no-c-calib3d"
description = "cv::calib3d for opencv-no-c: Rodrigues, homography, PnP and projection."
version.workspace = true
edition.workspace = true
rust-version = "1.77"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
# Published as `opencv-no-c-calib3d` (`cv-core` on crates.io belongs to another
# project); the library keeps its short name, so code still says `cv_*`.
name = "cv_calib3d"

[dependencies]
cv-core.workspace = true
cv-features2d.workspace = true
cv-imgproc.workspace = true
